name: publish
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'icon.png']
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/bon5co/kittentts-2-railway:0.2.0
            ghcr.io/bon5co/kittentts-2-railway:latest
